        // adding logo to bottom of panorama
        function addNadirLogo() {
            viewer.addHotSpot({
                "pitch": -90,
                "yaw": 0,
                "type": "info",
                "text": "",
                "cssClass": "nadir-logo",
                "createTooltipFunc": function (hotSpotDiv) {
                    hotSpotDiv.classList.add('nadir-logo');
                    const img = document.createElement('img');
                    img.src = 'https://raw.githubusercontent.com/byp51/lib-tour/refs/heads/main/Library%20images/test_logo.jpg';
                    img.alt = '';
                    hotSpotDiv.appendChild(img);
                }
            });
        }
        viewer.on('load', addNadirLogo);

        //---------------------------------------------------------------
        // For debugging: log the pitch and yaw of the mouse click
        //---------------------------------------------------------------
        viewer.on('mousedown', function(event) {
            const coords = viewer.mouseEventToCoords(event);
            console.log('pitch:', coords[0], 'yaw:', coords[1]);
        });

        // ---------------------------------------------------------------
        // Accessibility: make hotspots reachable and operable by keyboard
        // ---------------------------------------------------------------
        // Pannellum rebuilds hotspot elements every time a scene loads, so
        // rather than trying to catch a single event, we watch the
        // panorama container for any new elements being added and enhance
        // them as they appear.
        function enhanceHotspotAccessibility() {
            document.querySelectorAll('#panorama .pnlm-hotspot').forEach(function (el) {
                if (el.hasAttribute('data-a11y-enhanced')) return;
                el.setAttribute('data-a11y-enhanced', 'true');

                // Join the normal Tab order and announce as a button
                el.setAttribute('tabindex', '0');
                el.setAttribute('role', 'button');

                // Use the hotspot's own tooltip text as its accessible name
                const label = el.textContent.trim();
                if (label) {
                    el.setAttribute('aria-label', label);
                }

                // Reveal the tooltip on keyboard focus the same way it
                // reveals on mouse hover
                el.addEventListener('focus', function () {
                    el.dispatchEvent(new Event('mouseover'));
                });
                el.addEventListener('blur', function () {
                    el.dispatchEvent(new Event('mouseout'));
                });

                // Enter or Space activates it, same as a mouse click
                // (this covers scene jumps, URL links, and info tooltips)
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        el.click();
                    }
                });
            });
        }
        const panoramaContainer = document.getElementById('panorama');
        new MutationObserver(enhanceHotspotAccessibility).observe(panoramaContainer, {
            childList: true,
            subtree: true
        });
        // Run once immediately in case hotspots are already in the DOM
        enhanceHotspotAccessibility();
